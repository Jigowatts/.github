name: Update Linked Issues Status on PR Merge

on:
  pull_request:
    types: [closed]

jobs:
  update-status:
    # PRがマージされた場合のみ実行
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Update Linked Issue Status in Project
        uses: actions/github-script@v7
        env:
          FIELD_ID: "PVTSSF_lADOAHbWC84Bevq5zhZHmwQ"
          IN_REVIEW_OPTION_ID: "ef436d83"
          IN_TEST_OPTION_ID: "bb327e67"
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const fieldId = process.env.FIELD_ID;
            const inReviewOptionId = process.env.IN_REVIEW_OPTION_ID;
            const inTestOptionId = process.env.IN_TEST_OPTION_ID;
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            console.log(`=== デバッグ開始: PR #${prNumber} (${owner}/${repo}) ===`);
            console.log(`設定値: FIELD_ID=${fieldId}, IN_REVIEW_OPTION_ID=${inReviewOptionId}, IN_TEST_OPTION_ID=${inTestOptionId}`);

            const query = `
              query($owner: String!, $repo: String!, $prNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $prNumber) {
                    closingIssuesReferences(first: 10) {
                      nodes {
                        id
                        number
                        title
                        projectItems(first: 10) {
                          nodes {
                            id
                            project {
                              id
                              title
                            }
                            fieldValues(first: 10) {
                              nodes {
                                ... on ProjectV2ItemFieldSingleSelectValue {
                                  optionId
                                  name
                                  field {
                                    ... on ProjectV2SingleSelectField {
                                      id
                                      name
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, { owner, repo, prNumber });
            console.log("GraphQL raw response:", JSON.stringify(result, null, 2));

            const linkedIssues = result.repository.pullRequest.closingIssuesReferences.nodes;

            if (!linkedIssues || linkedIssues.length === 0) {
              console.log('【結果】紐づくIssueが見つかりませんでした。');
              return;
            }

            console.log(`検出された紐づきIssue数: ${linkedIssues.length}`);

            for (const issue of linkedIssues) {
              console.log(`--- Processing Issue #${issue.number}: "${issue.title}" ---`);
              
              if (!issue.projectItems || !issue.projectItems.nodes || issue.projectItems.nodes.length === 0) {
                console.log(`[SKIP] Issue #${issue.number} はどのプロジェクトにも登録されていません。`);
                continue;
              }

              for (const projectItem of issue.projectItems.nodes) {
                const targetProjectId = projectItem.project.id;
                const projectTitle = projectItem.project.title;
                console.log(`  Project: "${projectTitle}" (ID: ${targetProjectId})`);

                const statusFieldValue = projectItem.fieldValues.nodes.find(
                  fv => fv.field && fv.field.id === fieldId
                );

                console.log(`  取得されたStatusフィールド値:`, JSON.stringify(statusFieldValue, null, 2));

                const currentOptionId = statusFieldValue ? statusFieldValue.optionId : null;
                const currentOptionName = statusFieldValue ? statusFieldValue.name : "未設定/別フィールド";

                console.log(`  判定: 現在のOption ID="${currentOptionId}" (Name="${currentOptionName}"), 期待するOption ID="${inReviewOptionId}"`);

                if (currentOptionId === inReviewOptionId) {
                  console.log(`  【MATCH】"In Review" と一致したためステータス更新を行います。`);
                  const mutation = `
                    mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                      updateProjectV2ItemFieldValue(
                        input: {
                          projectId: $projectId
                          itemId: $itemId
                          fieldId: $fieldId
                          value: { singleSelectOptionId: $optionId }
                        }
                      ) {
                        projectV2Item {
                          id
                        }
                      }
                    }
                  `;

                  await github.graphql(mutation, {
                    projectId: targetProjectId,
                    itemId: projectItem.id,
                    fieldId,
                    optionId: inTestOptionId
                  });

                  console.log(`  【SUCCESS】Issue #${issue.number} のステータスを "In Test" に更新しました！`);
                } else {
                  console.log(`  [SKIP] 現在のステータスが "In Review" (ef436d83) でないため更新をスキップしました。`);
                }
              }
            }
            console.log("=== デバッグ終了 ===");
