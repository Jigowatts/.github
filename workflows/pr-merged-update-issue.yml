name: Update Linked Issues Status on PR Merge

on:
  pull_request:
    types: [closed]

jobs:
  update-status:
    # PRがマージされた場合のみ実行
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Update Linked Issue Status in Project
        uses: actions/github-script@v7
        env:
          PROJECT_ID: "PVT_kwDOAHbWC84Bevq5"
          FIELD_ID: "PVTSSF_lADOAHbWC84Bevq5zhZHmwQ"
          IN_REVIEW_OPTION_ID: "ef436d83"
          IN_TEST_OPTION_ID: "bb327e67"
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const projectId = process.env.PROJECT_ID;
            const fieldId = process.env.FIELD_ID;
            const inReviewOptionId = process.env.IN_REVIEW_OPTION_ID;
            const inTestOptionId = process.env.IN_TEST_OPTION_ID;
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 1. PRにリンクされているIssueとそのProject Itemの現在のステータスを取得するGraphQLクエリ
            const query = `
              query($owner: String!, $repo: String!, $prNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $prNumber) {
                    closingIssuesReferences(first: 10) {
                      nodes {
                        id
                        number
                        projectItems(first: 10) {
                          nodes {
                            id
                            project {
                              id
                            }
                            fieldValues(first: 10) {
                              nodes {
                                ... on ProjectV2ItemFieldSingleSelectValue {
                                  optionId
                                  field {
                                    ... on ProjectV2SingleSelectField {
                                      id
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, { owner, repo, prNumber });
            const linkedIssues = result.repository.pullRequest.closingIssuesReferences.nodes;

            if (linkedIssues.length === 0) {
              console.log('紐づくIssueが見つかりませんでした。');
              return;
            }

            // 2. 各IssueのProject Item Statusを判定・更新
            for (const issue of linkedIssues) {
              console.log(`Processing Issue #${issue.number}...`);
              
              // 該当プロジェクトに属するItem IDを探索
              const projectItem = issue.projectItems.nodes.find(item => item.project.id === projectId);

              if (!projectItem) {
                console.log(`Issue #${issue.number} は指定のプロジェクトに登録されていません。`);
                continue;
              }

              // 現在の Status フィールドの値を取得
              const statusFieldValue = projectItem.fieldValues.nodes.find(
                fv => fv.field && fv.field.id === fieldId
              );

              const currentOptionId = statusFieldValue ? statusFieldValue.optionId : null;

              // ステータスが "In Review" (ef436d83) の場合のみ "In Test" に更新
              if (currentOptionId === inReviewOptionId) {
                const mutation = `
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(
                      input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: { singleSelectOptionId: $optionId }
                      }
                    ) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                `;

                await github.graphql(mutation, {
                  projectId,
                  itemId: projectItem.id,
                  fieldId,
                  optionId: inTestOptionId
                });

                console.log(`Issue #${issue.number} のステータスを "In Review" から "In Test" に更新しました。`);
              } else {
                console.log(`Issue #${issue.number} の現在のステータス (Option ID: ${currentOptionId}) が "In Review" でないため、更新をスキップします。`);
              }
            }
